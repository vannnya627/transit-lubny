services:

    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - db_data:/var/lib/postgresql
        networks:
            - app-network
        ports:
            - "127.0.0.1:5433:5432"
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}" ]
            interval: 5s
            timeout: 5s
            retries: 5

    php-fpm:
        build:
            context: .
            dockerfile: docker/frankenphp/Dockerfile
        restart: unless-stopped
        env_file:
            -   .env
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - ./:/app
        networks:
            - app-network
        depends_on:
            postgres:
                condition: service_healthy

networks:
    app-network:
        driver: bridge

volumes:
    db_data:
